<!-- @dsCard group="Spacing" viewport="700x170" subtitle="8px grid (v2 §11.5)" name="Spacing scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);padding:20px;font-family:var(--font-ui);color:var(--text-primary)">
<div style="display:flex;align-items:flex-end;gap:16px">
  <div><div style="width:var(--space-1);height:var(--space-1);background:var(--primary);border-radius:2px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">1 · 4</div></div>
  <div><div style="width:var(--space-2);height:var(--space-2);background:var(--primary);border-radius:2px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">2 · 8</div></div>
  <div><div style="width:var(--space-3);height:var(--space-3);background:var(--primary);border-radius:3px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">3 · 12</div></div>
  <div><div style="width:var(--space-4);height:var(--space-4);background:var(--primary);border-radius:3px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">4 · 16</div></div>
  <div><div style="width:var(--space-5);height:var(--space-5);background:var(--primary);border-radius:4px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">5 · 24</div></div>
  <div><div style="width:var(--space-6);height:var(--space-6);background:var(--primary);border-radius:5px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">6 · 32</div></div>
  <div><div style="width:var(--space-7);height:var(--space-7);background:var(--primary);border-radius:6px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">7 · 48</div></div>
  <div><div style="width:var(--space-8);height:var(--space-8);background:var(--primary);border-radius:8px"></div><div style="font:400 12px/2 var(--font-ui);color:var(--text-secondary)">8 · 64</div></div>
</div>
</body></html>
