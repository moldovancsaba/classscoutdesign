<!-- @dsCard group="Colors" viewport="700x150" subtitle="Cool oat surfaces + soft borders" name="Surfaces & borders" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);font-family:var(--font-ui);padding:16px;color:var(--text-primary)">
<div style="display:flex;gap:12px">
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--bg-main);border:1px solid var(--border-soft)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--bg-main</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#ECEFE9 · page</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-soft)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--bg-card</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#FFFFFF · cards</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--bg-sunken)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--bg-sunken</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#E1E6DC · wells, skeletons</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--border-soft)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--border-soft</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#D8DCCF</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--border-strong)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--border-strong</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#CFC8BA</div></div>
</div>
</body></html>
