<!-- @dsCard group="Colors" viewport="700x150" subtitle="Logo-derived brand accents + the real mark" name="Brand colors" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);font-family:var(--font-ui);padding:16px;color:var(--text-primary)">
<div style="display:flex;gap:12px">
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--brand-navy)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--brand-navy</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#16323F · wordmark, footer</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--brand-sage)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--brand-sage</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#94A390 · illustration only</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--brand-clay)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--brand-clay</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#C98973 · illustration only</div></div>
  <div style="width:110px;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:12px"><img src="../assets/logo-pin.png" alt="ClassScout pin logo" style="height:80px"></div>
</div>
</body></html>
