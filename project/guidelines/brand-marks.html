<!-- @dsCard group="Brand" viewport="700x200" subtitle="Real marks from classscout.ai — never redraw" name="Logo & wordmark" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);padding:20px;font-family:var(--font-ui)">
<div style="display:flex;gap:16px;align-items:stretch">
  <div style="flex:1;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:16px;padding:12px"><img src="../assets/logo-pin.png" alt="ClassScout pin logo" style="height:120px"></div>
  <div style="flex:1;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:16px;padding:12px"><img src="../assets/wordmark.png" alt="Class Scout wordmark" style="height:120px"></div>
  <div style="flex:1;display:grid;place-items:center;background:var(--bg-navy);border-radius:16px;padding:12px"><img src="../assets/logo-pin-light.png" alt="ClassScout light pin logo on navy" style="height:120px"></div>
</div>
</body></html>
