<!-- @dsCard group="Shape" viewport="700x170" subtitle="Whisper-quiet shadows; hover lifts gently" name="Elevation" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);padding:24px;font-family:var(--font-ui);color:var(--text-primary)">
<div style="display:flex;gap:24px">
  <div style="text-align:center"><div style="width:150px;height:80px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card)"></div><div style="font:400 12px/2.4 var(--font-ui);color:var(--text-secondary)">--shadow-card (rest)</div></div>
  <div style="text-align:center"><div style="width:150px;height:80px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card-hover)"></div><div style="font:400 12px/2.4 var(--font-ui);color:var(--text-secondary)">--shadow-card-hover</div></div>
  <div style="text-align:center"><div style="width:150px;height:80px;background:var(--bg-card);border-radius:var(--radius-modal);box-shadow:var(--shadow-modal)"></div><div style="font:400 12px/2.4 var(--font-ui);color:var(--text-secondary)">--shadow-modal</div></div>
</div>
</body></html>
