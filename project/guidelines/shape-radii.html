<!-- @dsCard group="Shape" viewport="700x170" subtitle="Soft but not childish (v2 §11.4)" name="Corner radii" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);padding:20px;font-family:var(--font-ui);color:var(--text-primary)">
<div style="display:flex;gap:14px;align-items:flex-end">
  <div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-card);box-shadow:var(--shadow-card)"></div><div style="font:400 12px/2.2 var(--font-ui);color:var(--text-secondary)">card 18</div></div>
  <div style="text-align:center"><div style="width:96px;height:44px;background:var(--primary);border-radius:var(--radius-button)"></div><div style="font:400 12px/2.2 var(--font-ui);color:var(--text-secondary)">button 12</div></div>
  <div style="text-align:center"><div style="width:96px;height:36px;background:var(--bg-card);border:1px solid var(--border-strong);border-radius:var(--radius-chip)"></div><div style="font:400 12px/2.2 var(--font-ui);color:var(--text-secondary)">chip pill</div></div>
  <div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-sunken);border-radius:var(--radius-image)"></div><div style="font:400 12px/2.2 var(--font-ui);color:var(--text-secondary)">image 16</div></div>
  <div style="text-align:center"><div style="width:96px;height:72px;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-modal);box-shadow:var(--shadow-modal)"></div><div style="font:400 12px/2.2 var(--font-ui);color:var(--text-secondary)">modal/sheet 24</div></div>
</div>
</body></html>
