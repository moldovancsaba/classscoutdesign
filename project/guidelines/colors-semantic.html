<!-- @dsCard group="Colors" viewport="700x180" subtitle="Trust green, estimate amber, soft error red" name="Semantic colors" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);font-family:var(--font-ui);padding:16px;color:var(--text-primary)">
<div style="display:flex;gap:12px">
  <div style="flex:1">
    <div style="height:44px;border-radius:12px 12px 0 0;background:var(--trust)"></div>
    <div style="height:24px;border-radius:0 0 12px 12px;background:var(--trust-soft)"></div>
    <div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--trust #4E7C4A</div>
    <div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">Trust signals only — never on unconfirmed info.</div>
  </div>
  <div style="flex:1">
    <div style="height:44px;border-radius:12px 12px 0 0;background:var(--warning)"></div>
    <div style="height:24px;border-radius:0 0 12px 12px;background:var(--warning-soft)"></div>
    <div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--warning #C0801F</div>
    <div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">Estimates & “confirm before booking”. Not alarm.</div>
  </div>
  <div style="flex:1">
    <div style="height:44px;border-radius:12px 12px 0 0;background:var(--error)"></div>
    <div style="height:24px;border-radius:0 0 12px 12px;background:var(--error-soft)"></div>
    <div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--error #B0463F</div>
    <div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">Errors only — red is never “normal attention”.</div>
  </div>
</div>
</body></html>
