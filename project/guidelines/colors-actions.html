<!-- @dsCard group="Colors" viewport="700x150" subtitle="Teal actions, chip tint, highlight" name="Action colors" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);font-family:var(--font-ui);padding:16px;color:var(--text-primary)">
<div style="display:flex;gap:12px">
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--primary)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--primary</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#1F5E7A · main CTA</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--primary-dark)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--primary-dark</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#16455B · hover/press</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--secondary)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--secondary</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#D7DFD9 · quiet action</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--chip-bg)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--chip-bg</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#E2ECEA · chips, selected</div></div>
  <div style="flex:1"><div style="height:64px;border-radius:12px;background:var(--highlight)"></div><div style="font:500 13px/1.5 var(--font-ui);margin-top:8px">--highlight</div><div style="font:400 12px/1.4 var(--font-ui);color:var(--text-secondary)">#E7A733 · light emphasis</div></div>
</div>
</body></html>
