<!-- @dsCard group="Brand" viewport="700x170" subtitle="WCAG 2.2 AA — focus, targets, reduced motion" name="Accessibility" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--bg-main);padding:20px;font-family:var(--font-ui);color:var(--text-primary)">
<div style="display:flex;gap:20px;align-items:center">
  <div style="text-align:center">
    <button style="font:500 15px/1 var(--font-ui);background:var(--primary);color:#fff;border:none;border-radius:12px;padding:13px 20px;min-height:44px;outline:2px solid var(--focus-ring);outline-offset:2px;cursor:pointer">Show activities</button>
    <div style="font:400 12px/2.4 var(--font-ui);color:var(--text-secondary)">visible 2px focus ring</div>
  </div>
  <div style="text-align:center">
    <div style="width:44px;height:44px;border:1.5px dashed var(--border-strong);border-radius:10px;display:grid;place-items:center;margin:0 auto"><span style="width:20px;height:20px;border-radius:50%;background:var(--primary)"></span></div>
    <div style="font:400 12px/2.4 var(--font-ui);color:var(--text-secondary)">44px tap targets</div>
  </div>
  <div style="flex:1;font:var(--text-meta);color:var(--text-secondary)">AA contrast · visible labels · no hover-only functions · keyboard-usable filters · semantic headings · alt text · map always has a list alternative · prefers-reduced-motion respected in tokens/base.css.</div>
</div>
</body></html>
