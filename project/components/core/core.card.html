<!-- @dsCard group="Components" viewport="700x460" subtitle="Buttons, chips, save/compare, inputs" name="Core" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../assets/dev-loader.js"></script>
</head><body style="margin:0;background:var(--bg-main);font-family:var(--font-ui)">
<div id="root" style="padding:16px"></div>
<script>
window.addEventListener('error', function (e) {
  var r = document.getElementById('root');
  r.textContent = 'ERR: ' + e.message + ' @ ' + (e.filename || '') + ':' + e.lineno + '\n' + (e.error && e.error.stack ? e.error.stack.slice(0, 500) : '');
  r.style.font = '12px monospace'; r.style.whiteSpace = 'pre-wrap';
});
</script>
<script type="text/babel">
let Button, FilterChip, SaveButton, CompareButton, TextInput, SelectField;
function Demo() {
  const [saved, setSaved] = React.useState(true);
  const [cmp, setCmp] = React.useState(true);
  const [sel, setSel] = React.useState(['Ages 5–8']);
  const toggle = (l) => setSel((s) => s.includes(l) ? s.filter(x => x !== l) : [...s, l]);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        <Button icon="search">Show activities</Button>
        <Button variant="secondary" icon="sparkles">Let Scout guide me</Button>
        <Button variant="ghost" iconRight="external-link">Visit provider</Button>
        <Button variant="danger" size="sm">Remove</Button>
        <Button disabled>Show activities</Button>
      </div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
        {['Ages 5–8', 'Free', 'Indoor'].map((l) => (
          <FilterChip key={l} label={l} selected={sel.includes(l)} onClick={() => toggle(l)} />
        ))}
        <FilterChip label="Brooklyn" removable />
        <SaveButton saved={saved} onToggle={() => setSaved(!saved)} />
        <SaveButton showLabel={false} />
        <CompareButton comparing={cmp} onToggle={() => setCmp(!cmp)} count={3} />
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12 }}>
        <TextInput label="Neighbourhood" placeholder="e.g. Park Slope" hint="Borough or neighbourhood" />
        <TextInput label="Email" value="parent@" onChange={() => {}} error="Please enter a valid email address." />
        <SelectField label="Child age" placeholder="Any age" options={['0–2','3–5','5–8','6–10','11–14']} />
      </div>
    </div>
  );
}
getDS('../../', ['Button', 'FilterChip', 'CompareButton'], ['./Button.jsx', './FilterChip.jsx', './SaveButton.jsx', './CompareButton.jsx', './TextInput.jsx', './SelectField.jsx']).then((NS) => {
  ({ Button, FilterChip, SaveButton, CompareButton, TextInput, SelectField } = NS);
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script>
</body></html>
