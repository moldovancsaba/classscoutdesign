<!-- @dsCard group="Components" viewport="760x360" subtitle="Pin set + pin-tap preview card" name="Map" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../assets/dev-loader.js"></script>
</head><body style="margin:0;background:var(--bg-main);font-family:var(--font-ui)">
<div id="root" style="padding:16px"></div>
<script type="text/babel">
let MapPin, MapPreviewCard;
function Demo() {
  return (
    <div style={{ display: 'flex', gap: 20, alignItems: 'flex-start', flexWrap: 'wrap' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
        <div style={{ display: 'flex', gap: 18, alignItems: 'center', background: 'var(--bg-sunken)', borderRadius: 16, padding: '22px 20px' }}>
          <MapPin label="Standard" />
          <MapPin type="free" label="Free" />
          <MapPin type="saved" label="Saved" />
          <MapPin type="approximate" label="Approximate" />
          <MapPin label="Selected" selected />
          <MapPin type="cluster" count={12} />
        </div>
        <span style={{ font: 'var(--text-meta)', color: 'var(--text-secondary)' }}>standard · free · saved · approximate · selected · cluster</span>
      </div>
      <MapPreviewCard
        title="Kids Robotics Workshop" provider="Brooklyn Robot Foundry" ages="6–10"
        price="$45" schedule="Sat 10am" lastChecked="2 July 2026" sourceLabel="provider website"
        onViewDetails={() => {}} onClose={() => {}}
      />
    </div>
  );
}
getDS('../../', ['MapPin', 'MapPreviewCard'], ['./MapPin.jsx', './MapPreviewCard.jsx']).then((NS) => {
  ({ MapPin, MapPreviewCard } = NS);
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script>
</body></html>
