<!-- @dsCard group="Components" viewport="900x360" subtitle="Desktop top nav + mobile five-tab bottom nav" name="Navigation" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../assets/dev-loader.js"></script>
</head><body style="margin:0;background:var(--bg-main);font-family:var(--font-ui)">
<div id="root" style="padding:16px"></div>
<script type="text/babel">
let TopNav, BottomNav;
function Demo() {
  const [tab, setTab] = React.useState('search');
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div style={{ border: '1px solid var(--border-soft)', borderRadius: 12, overflow: 'hidden' }}>
        <TopNav current="week" onScout={() => {}} onMenu={() => {}} logoSrc="../../assets/logo-pin.png" style={{ position: 'static' }} />
      </div>
      <div style={{ width: 390, maxWidth: '100%', border: '1px solid var(--border-soft)', borderRadius: 16, overflow: 'hidden', position: 'relative', height: 140, background: 'var(--bg-main)' }}>
        <div style={{ padding: 12, font: 'var(--text-meta)', color: 'var(--text-secondary)' }}>Mobile viewport (390px)</div>
        <BottomNav current={tab} onNav={setTab} badge={{ saved: 3 }} style={{ position: 'absolute' }} />
      </div>
    </div>
  );
}
getDS('../../', ['TopNav', 'BottomNav'], ['./TopNav.jsx', './BottomNav.jsx']).then((NS) => {
  ({ TopNav, BottomNav } = NS);
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script>
</body></html>
