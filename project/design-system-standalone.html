  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ClassScout NYC Design System<\u002Ftitle>\n<link rel=\"icon\" href=\"e2ba80ff-c600-4eff-a42f-46855011078a\">\n<style>/* ClassScout NYC — global CSS entry. @import lines only. */\n/* Inter variable font (Google Fonts v20, latin subset), self-hosted. */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 400 700; /* variable file — one declaration covers the range */\n  font-display: swap;\n  src: url(\"52cbc644-5bb1-4afb-92af-a7341d9a985f\") format('woff2');\n}\n\n:root {\n  --font-ui: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;\n}\n\n/* ClassScout NYC — color tokens. Identity: \"Bluestone\" — cool NYC-civic warmth.\n   Drawn from the city's materials: bluestone sidewalks, park green, limestone,\n   a marigold spark. Deliberately NOT cream + soft-teal (the generic default).\n   Single source of truth: every component reads these variables. */\n:root {\n  /* Brand (pin mark: bluestone outline, sage cap, clay magnifier) */\n  --brand-navy: #16323F;      /* deep bluestone — footer, dark bands, saved pins */\n  --brand-sage: #94A390;      /* scout cap — illustration accents only */\n  --brand-clay: #C98973;      /* magnifier — illustration accents only */\n\n  /* Backgrounds — cool oat / limestone, not cream */\n  --bg-main: #ECEFE9;         /* page — cool oat */\n  --bg-card: #FFFFFF;         /* cards — crisp white lifts off the oat */\n  --bg-sunken: #E1E6DC;       /* wells, skeletons, map placeholder */\n  --bg-navy: var(--brand-navy);\n\n  /* Text — bluestone ink */\n  --text-primary: #1B2A31;    /* main text */\n  --text-secondary: #566670;  /* metadata */\n  --text-on-dark: #EEF1E9;\n  --text-on-primary: #FFFFFF;\n\n  /* Actions — bluestone blue */\n  --primary: #1F5E7A;         /* main CTA — civic bluestone, deeper than consumer teal */\n  --primary-dark: #16455B;    /* hover / pressed */\n  --secondary: #D7DFD9;       /* quiet secondary action (cool stone) */\n  --secondary-dark: #C7D1CA;  /* secondary hover */\n  --secondary-text: #2E3D44;\n\n  /* Semantic */\n  --trust: #4E7C4A;           /* pine/park green — trust signals, used sparingly */\n  --trust-soft: #E5EEDE;\n  --warning: #C0801F;         /* burnt amber — estimates / caution, never alarm */\n  --warning-soft: #F5EAD4;\n  --error: #B0463F;           /* muted brick red — errors, clear not frightening */\n  --error-soft: #F3E5E3;\n  --error-dark: #973930;      /* danger button hover */\n  --chip-bg: #E2ECEA;         /* filter chips resting tint (cool) */\n  --highlight: #E7A733;       /* MARIGOLD — signature brand accent (warmth, energy) */\n  --accent: var(--highlight); /* alias: the brand spark */\n  --accent-soft: #F7E7C4;     /* marigold wash for brand moments */\n  --skeleton-highlight: #DAE0D3; /* shimmer sweep peak */\n\n  /* Fixed white/overlays (rigid single source; used on images + dark bands) */\n  --pure-white: #FFFFFF;\n  --overlay-scrim-dark: rgba(22, 50, 63, 0.82);   /* dark badge over photos */\n  --overlay-scrim-light: rgba(255, 255, 255, 0.94); /* light badge over photos */\n  --on-dark-dim: rgba(238, 241, 233, 0.76);       /* dimmed text on bluestone */\n  --border-warning: rgba(192, 128, 31, 0.32);     /* amber panel border (--warning tint) */\n  --border-error: rgba(176, 70, 63, 0.28);        /* error panel border (--error tint) */\n\n  /* Borders + focus */\n  --border-soft: #D8DCCF;\n  --border-strong: #C1C7B6;\n  --focus-ring: #1F5E7A;\n\n  /* Semantic aliases */\n  --surface-page: var(--bg-main);\n  --surface-card: var(--bg-card);\n  --action-primary: var(--primary);\n  --badge-trust-bg: var(--trust-soft);\n  --badge-trust-text: #3A6137;\n  --badge-estimate-bg: var(--warning-soft);\n  --badge-estimate-text: #855814;\n  --badge-error-text: #8B362F;\n  --scrim: rgba(22, 50, 63, 0.44);\n}\n\n/* ClassScout NYC — type scale (handoff v2 §11.6).\n   clamp() makes every level responsive: mobile size → desktop size\n   without media queries, per the v2 desktop/mobile table. */\n:root {\n  /* H1 44–52 desktop / 32–36 mobile */\n  --text-h1: 650 clamp(32px, 2.2vw + 24px, 48px)/1.12 var(--font-ui);\n  /* H2 30–36 desktop / 24–28 mobile */\n  --text-h2: 600 clamp(24px, 1.2vw + 20px, 32px)/1.2 var(--font-ui);\n  /* H3 22–26 desktop / 20–22 mobile */\n  --text-h3: 600 clamp(20px, 0.5vw + 18px, 24px)/1.3 var(--font-ui);\n  /* Card title 18–20 desktop / 17–18 mobile */\n  --text-card-title: 600 clamp(17px, 0.25vw + 16px, 19px)/1.35 var(--font-ui);\n  --text-body: 400 16px/1.55 var(--font-ui);\n  --text-body-medium: 500 16px/1.55 var(--font-ui);\n  --text-meta: 400 14px/1.45 var(--font-ui);\n  --text-meta-medium: 500 14px/1.45 var(--font-ui);\n  --text-badge: 500 12.5px/1.2 var(--font-ui);\n\n  --tracking-wide: 0.08em; /* uppercase eyebrow/badge labels only */\n\n  /* Readability caps (v2 §33.3) */\n  --measure-text: 720px;   /* editorial/body text max width */\n  --measure-wide: 840px;\n}\n\n/* ClassScout NYC — spacing (handoff v2 §11.5, 8px grid). */\n:root {\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n\n  --card-pad: 16px;          /* mobile-first; screens may widen to 20–24 */\n  --page-max: 1200px;        /* text-heavy pages cap 1120–1280 (v2 §28.2) */\n  --page-pad: clamp(16px, 4vw, 32px);\n  --tap-target: 44px;        /* WCAG mobile comfort (v2 §13.2) */\n}\n\n/* ClassScout NYC — breakpoints (handoff v2 §28.1).\n   Tokens for documentation + JS matchMedia; CSS can't read vars in @media,\n   so media queries in kit CSS repeat these literals with a comment. */\n:root {\n  --bp-xs-max: 374px;   /* XS 0–374 small phones */\n  --bp-sm-min: 375px;   /* SM 375–599 standard phones */\n  --bp-md-min: 600px;   /* MD 600–899 large phones / small tablets */\n  --bp-lg-min: 900px;   /* LG 900–1199 tablets / small laptops */\n  --bp-xl-min: 1200px;  /* XL 1200–1439 desktop */\n  --bp-xxl-min: 1440px; /* XXL 1440+ large desktop */\n\n  /* Split-view geometry (v2 §32.3, §33.2) */\n  --rail-filter-w: 264px;   /* filter rail 240–280 */\n  --col-results-min: 420px; /* results column min */\n  --col-map-min: 420px;     /* map panel min */\n}\n\n/* ClassScout NYC — radii, shadows, motion (handoff v2 §11.4). */\n:root {\n  --radius-card: 18px;    /* cards 16–20 */\n  --radius-button: 12px;  /* buttons 12–14 */\n  --radius-chip: 999px;   /* chips + badges: full pill */\n  --radius-image: 16px;\n  --radius-modal: 24px;   /* modals + bottom sheets */\n  --radius-input: 12px;\n\n  --shadow-card: 0 1px 2px rgba(31, 41, 51, 0.06), 0 4px 12px rgba(31, 41, 51, 0.05);\n  --shadow-card-hover: 0 2px 4px rgba(31, 41, 51, 0.07), 0 10px 24px rgba(31, 41, 51, 0.09);\n  --shadow-sheet: 0 -8px 32px rgba(11, 34, 62, 0.14);\n  --shadow-modal: 0 12px 40px rgba(11, 34, 62, 0.18);\n  --shadow-nav: 0 -1px 0 var(--border-soft), 0 -6px 16px rgba(31, 41, 51, 0.06);\n\n  --border-card: 1px solid var(--border-soft);\n\n  --ease-calm: cubic-bezier(0.25, 0.6, 0.3, 1);\n  --duration-quick: 150ms;\n  --duration-gentle: 250ms;\n}\n\n/* ClassScout NYC — base rules. */\n:root { color-scheme: light; }\n\n.cs-focusable:focus-visible {\n  outline: 2px solid var(--focus-ring);\n  outline-offset: 2px;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: 0.01ms !important;\n  }\n}\n\n<\u002Fstyle>\n\n\n<script crossorigin=\"anonymous\" src=\"fbccf4ff-51bd-48dd-80cd-0b85f56f20d9\"><\u002Fscript>\n<script crossorigin=\"anonymous\" src=\"eaf870b8-3d8b-42a6-b003-a5c99442cedb\"><\u002Fscript>\n<script src=\"09926728-7548-4882-b067-a4acc64f0dd9\"><\u002Fscript>\n<style>\n  html, body { margin: 0; background: var(--bg-main); color: var(--text-primary); font-family: var(--font-ui); }\n  * { box-sizing: border-box; }\n  a { color: var(--primary-dark); }\n  .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); max-width: var(--page-max); margin: 0 auto; gap: var(--space-7); padding: 0 var(--page-pad); }\n  .toc { position: sticky; top: var(--space-5); align-self: start; padding: var(--space-5) 0 var(--space-7); display: flex; flex-direction: column; gap: var(--space-1); }\n  .toc a { font: var(--text-meta-medium); color: var(--text-secondary); text-decoration: none; padding: var(--space-2) var(--space-3); border-radius: var(--radius-chip); min-height: 36px; display: flex; align-items: center; }\n  .toc a:hover { background: var(--chip-bg); color: var(--primary-dark); }\n  .toc a[aria-current=\"true\"] { background: var(--chip-bg); color: var(--primary-dark); font-weight: 600; }\n  .toc .toc-h { font: var(--text-badge); color: var(--text-secondary); text-transform: uppercase; letter-spacing: var(--tracking-wide); margin: var(--space-4) var(--space-3) var(--space-1); }\n  main { padding-bottom: var(--space-8); min-width: 0; }\n  section.ds { margin-top: var(--space-8); scroll-margin-top: var(--space-5); }\n  h1 { font: var(--text-h1); margin: 0; text-wrap: pretty; }\n  h2 { font: var(--text-h2); margin: 0 0 var(--space-2); }\n  h3 { font: var(--text-h3); margin: var(--space-6) 0 var(--space-2); }\n  p.lede { font: var(--text-body); color: var(--text-secondary); max-width: var(--measure-text); margin: var(--space-2) 0 0; }\n  .demo { background: var(--surface-card); border: var(--border-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: var(--space-5); margin-top: var(--space-4); }\n  .demo-note { font: var(--text-meta); color: var(--text-secondary); margin-top: var(--space-3); }\n  .dodont { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }\n  .dd { border-radius: var(--radius-card); padding: var(--space-4); font: var(--text-meta); }\n  .dd ul { margin: var(--space-2) 0 0; padding-left: var(--space-5); display: grid; gap: var(--space-1); }\n  .dd.do { background: var(--trust-soft); color: var(--text-primary); }\n  .dd.dont { background: var(--error-soft); color: var(--text-primary); }\n  .dd .tag { font: var(--text-badge); padding: 4px var(--space-3); border-radius: var(--radius-chip); }\n  .dd.do .tag { background: var(--trust); color: var(--pure-white); }\n  .dd.dont .tag { background: var(--error); color: var(--pure-white); }\n  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); margin-top: var(--space-4); }\n  .sw .chip { height: 56px; border-radius: var(--radius-button); border: 1px solid var(--border-soft); }\n  .sw .n { font: var(--text-meta-medium); margin-top: var(--space-2); }\n  .sw .v { font: var(--text-badge); color: var(--text-secondary); }\n  table.spec { border-collapse: collapse; width: 100%; margin-top: var(--space-3); background: var(--surface-card); border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--border-soft); }\n  table.spec th, table.spec td { text-align: left; font: var(--text-meta); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border-soft); vertical-align: top; }\n  table.spec th { font: var(--text-meta-medium); color: var(--text-secondary); background: var(--bg-sunken); }\n  table.spec tr:last-child td { border-bottom: none; }\n  /* inline code: monospace is an intentional documentation exception (naming files/tokens); all colors/spacing are tokens */\n  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--bg-sunken); color: var(--text-primary); padding: 2px var(--space-2); border-radius: var(--radius-input); }\n  .audience { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--space-4); margin-top: var(--space-5); }\n  .aud { background: var(--surface-card); border: var(--border-card); border-radius: var(--radius-card); padding: var(--space-5); font: var(--text-meta); color: var(--text-secondary); }\n  .aud b { font: var(--text-body-medium); color: var(--text-primary); display: block; margin-bottom: var(--space-2); }\n  /* LG boundary from the breakpoint system (v2 §28.1) */\n  @media (max-width: 899px) { .layout { grid-template-columns: 1fr; } .toc { display: none; } }\n<\u002Fstyle>\n<\u002Fhead><body>\n\n<div class=\"layout\">\n  <nav class=\"toc\" aria-label=\"Contents\">\n    <span class=\"toc-h\">Foundations<\u002Fspan>\n    <a href=\"#intro\">Introduction<\u002Fa>\n    <a href=\"#principles\">Principles<\u002Fa>\n    <a href=\"#brand\">Brand<\u002Fa>\n    <a href=\"#color\">Color<\u002Fa>\n    <a href=\"#type\">Typography<\u002Fa>\n    <a href=\"#space\">Spacing &amp; shape<\u002Fa>\n    <a href=\"#layout\">Breakpoints &amp; layout<\u002Fa>\n    <a href=\"#voice\">Voice &amp; copy<\u002Fa>\n    <span class=\"toc-h\">System<\u002Fspan>\n    <a href=\"#trust\">Trust system<\u002Fa>\n    <a href=\"#core\">Core controls<\u002Fa>\n    <a href=\"#search\">Search &amp; filters<\u002Fa>\n    <a href=\"#listing\">Listing card<\u002Fa>\n    <a href=\"#detail\">Detail page blocks<\u002Fa>\n    <a href=\"#scout\">Scout AI<\u002Fa>\n    <a href=\"#states\">System states<\u002Fa>\n    <a href=\"#nav\">Navigation<\u002Fa>\n    <a href=\"#map\">Map<\u002Fa>\n    <span class=\"toc-h\">Delivery<\u002Fspan>\n    <a href=\"#a11y\">Accessibility<\u002Fa>\n    <a href=\"#resources\">For teams<\u002Fa>\n  <\u002Fnav>\n\n  <main>\n    <section class=\"ds\" id=\"intro\" style=\"margin-top:var(--space-7)\">\n      <div style=\"display:flex;align-items:center;gap:var(--space-4);flex-wrap:wrap\">\n        <img src=\"d078dea6-2fc1-416d-8db6-b9e6e3d36b45\" alt=\"ClassScout pin logo\" style=\"height:84px\">\n        <div>\n          <h1>ClassScout NYC Design System<\u002Fh1>\n          <p class=\"lede\">The single reference for how ClassScout looks, speaks, and behaves — for designers, developers, and decision makers. ClassScout is a <b>parent-first trust product<\u002Fb>: every element below exists to help a busy NYC parent decide faster and trust what they see.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"audience\">\n        <div class=\"aud\"><b>Designers<\u002Fb>Use the tokens, components, and do/don't rules verbatim. Compose screens from the components — don't redraw them.<\u002Fdiv>\n        <div class=\"aud\"><b>Developers<\u002Fb>Tokens live in <code>styles.css<\u002Fcode> → <code>tokens/<\u002Fcode>. Components in <code>components/<\u002Fcode> (React, inline-styled, token-driven). The live click-through is <code>ui_kits/classscout-web/index.html<\u002Fcode>.<\u002Fdiv>\n        <div class=\"aud\"><b>Decision makers<\u002Fb>The principles and trust system below are the product strategy: specific, source-backed, honest about uncertainty. If a screen violates them, it isn't ready.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"principles\">\n      <h2>Principles<\u002Fh2>\n      <p class=\"lede\">Theme: <b>calm civic warmth<\u002Fb> — local, useful, caring, credible. Never a toy app, coupon site, SaaS dashboard, or overhyped AI product.<\u002Fp>\n      <table class=\"spec\">\n        <tbody><tr><th>Principle<\u002Fth><th>What it means in the UI<\u002Fth><\u002Ftr>\n        <tr><td><b>Trust before cleverness<\u002Fb><\u002Ftd><td>Every badge has an operational definition. No jokes in system states. No \"verified\" without a verification process.<\u002Ftd><\u002Ftr>\n        <tr><td><b>Parent-first, not category-first<\u002Fb><\u002Ftd><td>Search starts from parent intent: age, place, date, budget — not taxonomy browsing.<\u002Ftd><\u002Ftr>\n        <tr><td><b>Make uncertainty visible<\u002Fb><\u002Ftd><td>\"Estimated from $45 — confirm with provider\", \"Last checked 2 July 2026\", \"Age not confirmed\". Never hidden in footers.<\u002Ftd><\u002Ftr>\n        <tr><td><b>Every listing answers five things<\u002Fb><\u002Ftd><td>Age · location · time · cost · source/freshness. A card missing one shows its \"not confirmed\" state instead.<\u002Ftd><\u002Ftr>\n        <tr><td><b>Mobile is for finding, tablet for comparing, desktop for planning<\u002Fb><\u002Ftd><td>Same product logic everywhere; layout, navigation, and density adapt per breakpoint.<\u002Ftd><\u002Ftr>\n        <tr><td><b>Scout is a guide, not an authority<\u002Fb><\u002Ftd><td>\"May fit\" + reasons + what to confirm. Never \"best\", \"guaranteed\", \"safe\", \"AI verified\".<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"brand\">\n      <h2>Brand<\u002Fh2>\n      <p class=\"lede\">One name, always: <b>ClassScout NYC<\u002Fb>. Never \"Class Scout NY\", \"ClassScout NY\", or other mixes. The pin mark and wordmark are real assets in <code>assets/<\u002Fcode> — never redraw them.<\u002Fp>\n      <div class=\"demo\" style=\"display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:stretch\">\n        <div style=\"flex:1;min-width:180px;display:grid;place-items:center;background:var(--bg-main);border:1px solid var(--border-soft);border-radius:var(--radius-image);padding:var(--space-5)\"><img src=\"d078dea6-2fc1-416d-8db6-b9e6e3d36b45\" alt=\"Pin logo on oat\" style=\"height:110px\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:180px;display:grid;place-items:center;background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-image);padding:var(--space-5)\"><img src=\"1dad0f47-0106-491f-a051-d271368a3e75\" alt=\"Wordmark\" style=\"height:110px\"><\u002Fdiv>\n        <div style=\"flex:1;min-width:180px;display:grid;place-items:center;background:var(--brand-navy);border-radius:var(--radius-image);padding:var(--space-5)\"><img src=\"a1552e8d-0ab9-473c-9ca6-d6d3f85b75bf\" alt=\"Light pin logo on navy\" style=\"height:110px\"><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"demo-note\">On dark backgrounds (navy footer, dark bands) always use the light variant <code>assets/logo-pin-light.png<\u002Fcode>; the standard mark is for oat/white surfaces. Sage <code>#94A390<\u002Fcode> and clay <code>#C98973<\u002Fcode> come from the mascot and are illustration accents only — never actions or semantics. Logo currently exists as PNG only; request vector source from the team.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"color\">\n      <h2>Color<\u002Fh2>\n      <p class=\"lede\"><b>Bluestone<\u002Fb> — a cool NYC-civic palette from the city's own materials: bluestone-blue that acts, park green that confirms, burnt amber that flags estimates, brick red reserved for errors, and a marigold spark for warmth. Cool oat paper, not cream. Warm, readable, low-anxiety.<\u002Fp>\n      <div class=\"swatches\">\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--bg-main)\"><\u002Fdiv><div class=\"n\">--bg-main<\u002Fdiv><div class=\"v\">#ECEFE9 · page<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--bg-card)\"><\u002Fdiv><div class=\"n\">--bg-card<\u002Fdiv><div class=\"v\">#FFFFFF · cards<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--bg-sunken)\"><\u002Fdiv><div class=\"n\">--bg-sunken<\u002Fdiv><div class=\"v\">#E1E6DC · wells<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--text-primary)\"><\u002Fdiv><div class=\"n\">--text-primary<\u002Fdiv><div class=\"v\">#1B2A31<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--text-secondary)\"><\u002Fdiv><div class=\"n\">--text-secondary<\u002Fdiv><div class=\"v\">#566670 · metadata<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--primary)\"><\u002Fdiv><div class=\"n\">--primary<\u002Fdiv><div class=\"v\">#1F5E7A · main CTA<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--primary-dark)\"><\u002Fdiv><div class=\"n\">--primary-dark<\u002Fdiv><div class=\"v\">#16455B · hover<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--chip-bg)\"><\u002Fdiv><div class=\"n\">--chip-bg<\u002Fdiv><div class=\"v\">#E2ECEA · chips<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--trust)\"><\u002Fdiv><div class=\"n\">--trust<\u002Fdiv><div class=\"v\">#4E7C4A · trust only<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--warning)\"><\u002Fdiv><div class=\"n\">--warning<\u002Fdiv><div class=\"v\">#C0801F · estimates<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--error)\"><\u002Fdiv><div class=\"n\">--error<\u002Fdiv><div class=\"v\">#B0463F · errors only<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--highlight)\"><\u002Fdiv><div class=\"n\">--highlight<\u002Fdiv><div class=\"v\">#E7A733 · marigold accent<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--brand-navy)\"><\u002Fdiv><div class=\"n\">--brand-navy<\u002Fdiv><div class=\"v\">#16323F · footer<\u002Fdiv><\u002Fdiv>\n        <div class=\"sw\"><div class=\"chip\" style=\"background:var(--border-soft)\"><\u002Fdiv><div class=\"n\">--border-soft<\u002Fdiv><div class=\"v\">#D8DCCF<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dodont\">\n        <div class=\"dd do\"><span class=\"tag\">Do<\u002Fspan><ul><li>Teal for primary actions, one per screen<\u002Fli><li>Green only on confirmed trust signals<\u002Fli><li>Amber for estimates and \"check this\"<\u002Fli><li>Maintain WCAG 2.2 AA contrast<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"dd dont\"><span class=\"tag\">Don't<\u002Fspan><ul><li>Neon gradients or rainbow systems<\u002Fli><li>Red for normal attention<\u002Fli><li>Low-contrast grey for important metadata<\u002Fli><li>Green checkmarks on unconfirmed info<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"type\">\n      <h2>Typography<\u002Fh2>\n      <p class=\"lede\">Inter (self-hosted variable font, system fallback). Every heading token uses <code>clamp()<\u002Fcode>, resolving mobile→desktop automatically. Sentence case everywhere.<\u002Fp>\n      <div class=\"demo\">\n        <div style=\"font:var(--text-h1)\">H1 — Find trusted kids’ activities<\u002Fdiv>\n        <div style=\"font:var(--text-h2);margin-top:10px\">H2 — How ClassScout helps parents decide<\u002Fdiv>\n        <div style=\"font:var(--text-h3);margin-top:10px\">H3 — Check before booking<\u002Fdiv>\n        <div style=\"font:var(--text-card-title);margin-top:10px\">Card title — Kids Robotics Workshop<\u002Fdiv>\n        <div style=\"font:var(--text-body);margin-top:10px;max-width:var(--measure-text)\">Body 16 — Hands-on robotics class for children who enjoy building, problem-solving, and small-group STEM activities.<\u002Fdiv>\n        <div style=\"font:var(--text-meta);color:var(--text-secondary);margin-top:10px\">Meta 14 — Brooklyn Robot Foundry · Park Slope, Brooklyn · Last checked 2 July 2026<\u002Fdiv>\n        <div style=\"font:var(--text-badge);color:var(--text-secondary);margin-top:10px;text-transform:uppercase;letter-spacing:var(--tracking-wide)\">Badge 12.5 — official source<\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"demo-note\">H1 32→48 · H2 24→32 · H3 20→24 · card title 17→19. Editorial text max-width 720px. Uppercase + letterspacing for tiny eyebrows only.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"space\">\n      <h2>Spacing &amp; shape<\u002Fh2>\n      <p class=\"lede\">8px grid: 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64. Soft but not childish.<\u002Fp>\n      <table class=\"spec\">\n        <tbody><tr><th>Element<\u002Fth><th>Radius<\u002Fth><th>Elevation<\u002Fth><\u002Ftr>\n        <tr><td>Cards<\u002Ftd><td>18px (<code>--radius-card<\u002Fcode>) + 1px <code>--border-soft<\u002Fcode><\u002Ftd><td><code>--shadow-card<\u002Fcode>, lifts to <code>--shadow-card-hover<\u002Fcode><\u002Ftd><\u002Ftr>\n        <tr><td>Buttons / inputs<\u002Ftd><td>12px<\u002Ftd><td>flat<\u002Ftd><\u002Ftr>\n        <tr><td>Chips &amp; badges<\u002Ftd><td>full pill<\u002Ftd><td>flat<\u002Ftd><\u002Ftr>\n        <tr><td>Images<\u002Ftd><td>16px<\u002Ftd><td>—<\u002Ftd><\u002Ftr>\n        <tr><td>Modals / bottom sheets<\u002Ftd><td>24px<\u002Ftd><td><code>--shadow-modal<\u002Fcode> / <code>--shadow-sheet<\u002Fcode> over a navy scrim<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n      <p class=\"demo-note\">Motion: 150–250ms <code>--ease-calm<\u002Fcode> fades and lifts only. <code>prefers-reduced-motion<\u002Fcode> is respected globally. Hover darkens; press darkens further; nothing shrinks or bounces.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"layout\">\n      <h2>Breakpoints &amp; layout<\u002Fh2>\n      <table class=\"spec\">\n        <tbody><tr><th>Range<\u002Fth><th>Name<\u002Fth><th>Layout rules<\u002Fth><\u002Ftr>\n        <tr><td>0–374<\u002Ftd><td>XS<\u002Ftd><td rowspan=\"2\">Single column only. Five-tab bottom nav. Filters in a bottom sheet. Compact cards. Map is a separate full-screen mode — never beside the list.<\u002Ftd><\u002Ftr>\n        <tr><td>375–599<\u002Ftd><td>SM<\u002Ftd><\u002Ftr>\n        <tr><td>600–899<\u002Ftd><td>MD<\u002Ftd><td>1–2 column card grid, inline search panel, chips + filter drawer.<\u002Ftd><\u002Ftr>\n        <tr><td>900–1199<\u002Ftd><td>LG<\u002Ftd><td>Two columns allowed; tablet landscape gets the list + map split with synced selection.<\u002Ftd><\u002Ftr>\n        <tr><td>1200–1439<\u002Ftd><td>XL<\u002Ftd><td>Filter rail (264px) + results (≥420px) + map (≥420px). Top navigation, hover as enhancement.<\u002Ftd><\u002Ftr>\n        <tr><td>1440+<\u002Ftd><td>XXL<\u002Ftd><td>Same as XL; text-heavy pages stay capped at 1200px.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n      <p class=\"demo-note\">Never horizontal scroll. Rotation and navigation preserve filters, scroll, selection, and map bounds. See it live: resize <a href=\"ui_kits/classscout-web/index.html\">the UI kit<\u002Fa>.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"voice\">\n      <h2>Voice &amp; copy<\u002Fh2>\n      <p class=\"lede\">Calm, practical, transparent, local, adult-facing. Precision beats promise — specific claims are what make parents trust the product.<\u002Fp>\n      <div class=\"dodont\">\n        <div class=\"dd do\"><span class=\"tag\">Say<\u002Fspan><ul>\n          <li>\"Estimated price shown for planning.\"<\u002Fli>\n          <li>\"Last checked 2 July 2026.\"<\u002Fli>\n          <li>\"This may fit because it is indoor and listed for ages 5–8.\"<\u002Fli>\n          <li>\"Good for children who enjoy hands-on building.\"<\u002Fli>\n          <li>\"Schedule may change. Please confirm with the provider.\"<\u002Fli>\n          <li>\"No child name required.\"<\u002Fli>\n        <\u002Ful><\u002Fdiv>\n        <div class=\"dd dont\"><span class=\"tag\">Never<\u002Fspan><ul>\n          <li>\"Guaranteed safe.\" / \"Fully verified.\"<\u002Fli>\n          <li>\"Perfect for every child!\"<\u002Fli>\n          <li>\"AI-powered magic!\"<\u002Fli>\n          <li>\"The best activity in NYC.\"<\u002Fli>\n          <li>\"Cheap\" / \"Only $25\"<\u002Fli>\n          <li>Jokes in loading or error states<\u002Fli>\n        <\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n      <table class=\"spec\">\n        <tbody><tr><th>Content<\u002Fth><th>Rule<\u002Fth><\u002Ftr>\n        <tr><td>Listing title<\u002Ftd><td>Clear activity name (\"Kids Robotics Workshop\"), never promotional. Provider name always separate.<\u002Ftd><\u002Ftr>\n        <tr><td>Summary<\u002Ftd><td>One sentence, 100–160 chars: <i>[format] for [age/interest] in [context], useful for [parent benefit]<\u002Fi>.<\u002Ftd><\u002Ftr>\n        <tr><td>Price<\u002Ftd><td>\"Free\" · \"Estimated from $25\" · \"Price not confirmed\" — status is always explicit.<\u002Ftd><\u002Ftr>\n        <tr><td>Schedule<\u002Ftd><td>\"This Saturday\" · \"Drop-in available\" · \"Schedule not confirmed\" — exact vs estimated is always distinguished.<\u002Ftd><\u002Ftr>\n        <tr><td>Source<\u002Ftd><td>\"Source: provider website\" · \"Last checked: 2 July 2026\" · weak source → \"Source not confirmed. Please verify details before attending.\"<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"trust\">\n      <h2>Trust system<\u002Fh2>\n      <p class=\"lede\">Nine labels, each with an operational meaning. Use a badge only when its condition is true; unknowns get the amber \"not confirmed\" labels, never silence.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-trust\"><\u002Fdiv><\u002Fdiv>\n      <table class=\"spec\">\n        <tbody><tr><th>Label<\u002Fth><th>Meaning<\u002Fth><\u002Ftr>\n        <tr><td>Official source<\u002Ftd><td>Provider, venue, school, city, or official event page<\u002Ftd><\u002Ftr>\n        <tr><td>Public source<\u002Ftd><td>Public directory, event feed, or mapped business data<\u002Ftd><\u002Ftr>\n        <tr><td>Provider claimed<\u002Ftd><td>Provider completed the claim/update flow<\u002Ftd><\u002Ftr>\n        <tr><td>Recently checked<\u002Ftd><td>Checked within the freshness window (events 7d · this-week 3–5d · camps 14d · classes 30d · venues 60–90d)<\u002Ftd><\u002Ftr>\n        <tr><td>Price / schedule estimate<\u002Ftd><td>Useful for planning, not guaranteed<\u002Ftd><\u002Ftr>\n        <tr><td>Age / source not confirmed<\u002Ftd><td>Field inferred or missing — shown, never omitted<\u002Ftd><\u002Ftr>\n        <tr><td>Reported outdated<\u002Ftd><td>A user flagged possible stale information<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n      <p class=\"demo-note\">Public copy is explainable (\"High confidence: recently checked from provider source\") — never numeric scores, never \"AI verified\", \"safe\", or \"approved\".<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"core\">\n      <h2>Core controls<\u002Fh2>\n      <p class=\"lede\">Buttons (one primary per screen), pill filter chips (always reversible), save and compare toggles, labelled fields. All targets ≥44px, all focus rings visible.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-core\"><\u002Fdiv><\u002Fdiv>\n      <p class=\"demo-note\">Labels are sentence case. Save is never hidden in an overflow menu. Selected chips turn solid teal; active-filter rows use the removable variant with ×.<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"search\">\n      <h2>Search &amp; filters<\u002Fh2>\n      <p class=\"lede\">The homepage behaves like a tool: five parent-intent fields, one primary action, Scout as the secondary path, and a trust line underneath. Quick-start cards match real parent situations.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-search\"><\u002Fdiv><\u002Fdiv>\n      <p class=\"demo-note\">Full filter set (age, location, date, price, type, indoor/outdoor, booking, source confidence) lives in <code>FilterSheet<\u002Fcode> — bottom sheet on mobile, 264px rail on desktop. Results always show active filters as removable chips: \"Showing: Ages 5–8 · Brooklyn · This weekend\".<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"listing\">\n      <h2>Listing card<\u002Fh2>\n      <p class=\"lede\">The most important component. It must answer: what is it, who is it for, where, when, what does it cost, how reliable is the information, and what's the next step.<\u002Fp>\n      <div class=\"demo\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,380px));gap:20px\"><div id=\"demo-card\"><\u002Fdiv><div id=\"demo-card2\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"dodont\">\n        <div class=\"dd do\"><span class=\"tag\">Do<\u002Fspan><ul><li>Real listing/provider imagery only; no image → honest placeholder<\u002Fli><li>Age and source states always present<\u002Fli><li>Price and freshness in the decision row<\u002Fli><li>Summary ≤160 characters<\u002Fli><\u002Ful><\u002Fdiv>\n        <div class=\"dd dont\"><span class=\"tag\">Don't<\u002Fspan><ul><li>Generic child stock photos<\u002Fli><li>Cards without age state — use \"Age not confirmed\"<\u002Fli><li>\"Verified\" badges without verification<\u002Fli><li>Price uncertainty buried in footers<\u002Fli><\u002Ful><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"detail\">\n      <h2>Detail page blocks<\u002Fh2>\n      <p class=\"lede\">A detail page is a parent briefing, in this order: parent summary → key facts → why it may fit → what to confirm → source block → report path. On mobile the facts table stacks.<\u002Fp>\n      <div class=\"demo\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\"><div id=\"demo-facts\"><\u002Fdiv><div id=\"demo-confirm\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"demo\"><div id=\"demo-source\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"scout\">\n      <h2>Scout AI<\u002Fh2>\n      <p class=\"lede\">A guided discovery assistant. Every recommendation explains why it <i>may<\u002Fi> fit, what it's based on, what's uncertain, and what to confirm — and links out. The privacy note (\"Do not enter a child's full name\") ships with the entry card.<\u002Fp>\n      <div class=\"demo\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\"><div id=\"demo-scout\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"states\">\n      <h2>System states<\u002Fh2>\n      <p class=\"lede\">States communicate product quality. Loading is serious and skeletal; empty states name the search and offer recovery; errors keep a route forward. Never jokes, never dead ends.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-states\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"nav\">\n      <h2>Navigation<\u002Fh2>\n      <p class=\"lede\">Desktop: one row — six task links max + \"Ask Scout\" CTA; secondary items (About, How trust works, legal) behind the hamburger. Mobile: exactly five bottom tabs — Search · This Week · Saved · Scout · Account. Navigation always preserves search state.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-nav\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"map\">\n      <h2>Map<\u002Fh2>\n      <p class=\"lede\">The map answers \"is this reachable?\" — it is never the only path (an accessible list always exists). Mobile has separate list/map modes; tablet landscape and desktop use a synced split view. Few pin colours, on purpose.<\u002Fp>\n      <div class=\"demo\"><div id=\"demo-map\"><\u002Fdiv><\u002Fdiv>\n      <p class=\"demo-note\">Pins: teal standard · green free · navy saved · muted approximate (\"Approximate area\" when the exact address is unknown) · count clusters · selected = larger + navy ring. Engine recommendation: MapLibre + OSM tiles (or Mapbox). Location permission is optional and requested only on \"Near me\".<\u002Fp>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"a11y\">\n      <h2>Accessibility — WCAG 2.2 AA<\u002Fh2>\n      <p class=\"lede\">Parents use this one-handed, outdoors, carrying a child, under time pressure. Accessibility is product quality, not compliance.<\u002Fp>\n      <table class=\"spec\">\n        <tbody><tr><th>Requirement<\u002Fth><th>How the system delivers it<\u002Fth><\u002Ftr>\n        <tr><td>Keyboard access + visible focus<\u002Ftd><td>Every control uses the shared 2px teal focus ring (<code>.cs-focusable<\u002Fcode>)<\u002Ftd><\u002Ftr>\n        <tr><td>Tap targets ≥44px<\u002Ftd><td><code>--tap-target<\u002Fcode> enforced in buttons, inputs, nav tabs, save controls<\u002Ftd><\u002Ftr>\n        <tr><td>No hover-only interactions<\u002Ftd><td>Hover only darkens/lifts; all functions work by click/tap/keyboard<\u002Ftd><\u002Ftr>\n        <tr><td>Labels &amp; errors<\u002Ftd><td>Every field has a visible label; errors explain recovery and use <code>role=\"alert\"<\u002Fcode><\u002Ftd><\u002Ftr>\n        <tr><td>Map alternative<\u002Ftd><td>Every pin corresponds to a list item; pins carry text labels<\u002Ftd><\u002Ftr>\n        <tr><td>Reduced motion<\u002Ftd><td><code>prefers-reduced-motion<\u002Fcode> globally disables animation in <code>tokens/base.css<\u002Fcode><\u002Ftd><\u002Ftr>\n        <tr><td>Colour independence<\u002Ftd><td>Trust states pair colour with icon + text; no colour-only meaning<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n    <\u002Fsection>\n\n    <section class=\"ds\" id=\"resources\">\n      <h2>For teams<\u002Fh2>\n      <table class=\"spec\">\n        <tbody><tr><th>Audience<\u002Fth><th>Start here<\u002Fth><\u002Ftr>\n        <tr><td>Designers<\u002Ftd><td>This page + the Design System tab cards. Compose from components; check the do/don't lists before shipping.<\u002Ftd><\u002Ftr>\n        <tr><td>Developers<\u002Ftd><td><code>styles.css<\u002Fcode> (tokens entry) · <code>components/&lt;group&gt;/*.jsx<\u002Fcode> with <code>.d.ts<\u002Fcode> props contracts and <code>.prompt.md<\u002Fcode> usage notes · <code>fonts/<\u002Fcode> self-hosted Inter.<\u002Ftd><\u002Ftr>\n        <tr><td>Product / decision makers<\u002Ftd><td><code>readme.md<\u002Fcode> (design guide) · <code>guidelines/handoff-v2-digest.md<\u002Fcode> (operative spec: acceptance criteria, freshness windows, metrics).<\u002Ftd><\u002Ftr>\n        <tr><td>Everyone<\u002Ftd><td>Live click-through: <a href=\"ui_kits/classscout-web/index.html\">ClassScout web UI kit<\u002Fa> — resize to see every breakpoint.<\u002Ftd><\u002Ftr>\n      <\u002Ftbody><\u002Ftable>\n      <p class=\"demo-note\">Open questions for the brand team: vector logo source; the production icon set (Lucide is a stand-in); real listing photography.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\nconst h = React.createElement;\nfunction mount(id, node) { const el = document.getElementById(id); if (el) ReactDOM.createRoot(el).render(node); }\nconst row = (gap) => ({ display: 'flex', gap: gap || 10, flexWrap: 'wrap', alignItems: 'center' });\n\nPromise.resolve(window.CSDS).then((NS) => {\n  if (!NS) throw new Error('component bundle missing');\n  const { Button, FilterChip, SaveButton, CompareButton, TextInput, SelectField,\n    TrustBadge, PriceEstimateLabel, LastCheckedLabel, ReportOutdatedLink, SourceBlock,\n    HeroSearchPanel, QuickStartCard, ActivityCard, DetailFactsTable, ConfirmChecklist,\n    ScoutPromptCard, ScoutResultCard, EmptyState, ErrorState, LoadingSkeleton,\n    TopNav, BottomNav, MapPin, MapPreviewCard } = NS;\n\n  mount('demo-trust', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 14 } },\n    h('div', { style: row(8) }, ['official-source','public-source','provider-claimed','recently-checked','price-estimate','schedule-estimate','age-not-confirmed','source-not-confirmed','reported-outdated'].map((k) => h(TrustBadge, { key: k, kind: k }))),\n    h('div', { style: row(16) },\n      h(PriceEstimateLabel, { status: 'free' }),\n      h(PriceEstimateLabel, { amount: '$45' }),\n      h(PriceEstimateLabel, { status: 'unknown' })),\n    h(LastCheckedLabel, { date: '2 July 2026', source: 'provider website' }),\n    h(LastCheckedLabel, { date: '28 May 2026', stale: true }),\n    h(ReportOutdatedLink, {})\n  ));\n\n  function CoreDemo() {\n    const [saved, setSaved] = React.useState(true);\n    const [cmp, setCmp] = React.useState(false);\n    const [sel, setSel] = React.useState(['Ages 5–8']);\n    const toggle = (l) => setSel((s) => s.includes(l) ? s.filter((x) => x !== l) : [...s, l]);\n    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },\n      h('div', { style: row() },\n        h(Button, { icon: 'search' }, 'Show activities'),\n        h(Button, { variant: 'secondary', icon: 'sparkles' }, 'Let Scout guide me'),\n        h(Button, { variant: 'ghost', iconRight: 'external-link' }, 'Visit provider'),\n        h(Button, { variant: 'danger', size: 'sm' }, 'Remove'),\n        h(Button, { disabled: true }, 'Show activities')),\n      h('div', { style: row(8) },\n        ['Ages 5–8', 'Free', 'Indoor'].map((l) => h(FilterChip, { key: l, label: l, selected: sel.includes(l), onClick: () => toggle(l) })),\n        h(FilterChip, { label: 'Brooklyn', removable: true }),\n        h(SaveButton, { saved, onToggle: () => setSaved(!saved) }),\n        h(CompareButton, { comparing: cmp, onToggle: () => setCmp(!cmp), count: cmp ? 2 : 0 })),\n      h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12 } },\n        h(TextInput, { label: 'Neighbourhood', placeholder: 'e.g. Park Slope', hint: 'Borough or neighbourhood' }),\n        h(TextInput, { label: 'Email', value: 'parent@', onChange: () => {}, error: 'Please enter a valid email address.' }),\n        h(SelectField, { label: 'Child age', placeholder: 'Any age', options: ['0–2', '3–5', '5–8', '6–10', '11–14'] })));\n  }\n  mount('demo-core', h(CoreDemo));\n\n  mount('demo-search', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },\n    h(HeroSearchPanel, {}),\n    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 10 } },\n      h(QuickStartCard, { label: 'This weekend', icon: 'calendar' }),\n      h(QuickStartCard, { label: 'Free & low-cost', icon: 'info' }),\n      h(QuickStartCard, { label: 'Indoor activities', icon: 'house' }),\n      h(QuickStartCard, { label: 'Near me', icon: 'locate-fixed' }))));\n\n  function CardDemo(props) {\n    const [saved, setSaved] = React.useState(!!props.startSaved);\n    return h(ActivityCard, Object.assign({\n      saved, onToggleSave: () => setSaved(!saved),\n      onViewDetails: () => {}, providerHref: '#', onAskScout: () => {},\n    }, props.card));\n  }\n  mount('demo-card', h(CardDemo, { startSaved: false, card: {\n    title: 'Kids Robotics Workshop', provider: 'Brooklyn Robot Foundry', neighborhood: 'Park Slope, Brooklyn',\n    category: 'STEM', ages: '6–10', setting: 'Indoor',\n    summary: 'Hands-on robotics class for children who enjoy building and problem-solving.',\n    price: '$45', schedule: 'This Saturday',\n    sourceKind: 'official-source', lastChecked: '2 July 2026', sourceLabel: 'provider website',\n  } }));\n  mount('demo-card2', h(CardDemo, { startSaved: true, card: {\n    title: 'After-School Art Studio', provider: 'Uptown Art House', neighborhood: 'Harlem, Manhattan',\n    category: 'Art', setting: 'Indoor',\n    summary: 'Small-group drawing and painting for children who like making things at their own pace.',\n    priceStatus: 'unknown', schedule: 'Schedule not confirmed',\n    sourceKind: 'source-not-confirmed', lastChecked: '20 May 2026', sourceLabel: 'public listing', stale: true,\n  } }));\n\n  mount('demo-facts', h(DetailFactsTable, { rows: [\n    { label: 'Age range', value: '6–10' },\n    { label: 'Activity type', value: 'STEM class' },\n    { label: 'Location', value: 'Park Slope, Brooklyn' },\n    { label: 'Price', value: h(PriceEstimateLabel, { amount: '$45' }) },\n    { label: 'Booking', value: 'Registration required' },\n    { label: 'Last checked', value: '2 July 2026' },\n  ] }));\n  mount('demo-confirm', h(ConfirmChecklist, {}));\n  mount('demo-source', h(SourceBlock, { sourceType: 'Official provider website', sourceUrl: '#', lastChecked: '2 July 2026' }));\n\n  mount('demo-scout', h(React.Fragment, null,\n    h(ScoutPromptCard, { beta: true }),\n    h(ScoutResultCard, {\n      title: 'Kids Robotics Workshop', provider: 'Brooklyn Robot Foundry', neighborhood: 'Park Slope, Brooklyn',\n      reason: 'it is indoor, listed for ages 6–10, and available this weekend in Brooklyn.',\n      confirmItems: ['Current price', 'Exact time', 'Whether registration is required'],\n      onViewDetails: () => {}, providerHref: '#',\n    })));\n\n  mount('demo-states', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },\n    h(EmptyState, { title: 'No matching activities found for ages 5–8 in Park Slope this weekend' }),\n    h(ErrorState, { onRetry: () => {}, actions: [{ label: 'Browse this week' }, { label: 'Ask Scout', icon: 'sparkles' }] }),\n    h(LoadingSkeleton, { count: 2 })));\n\n  function NavDemo() {\n    const [tab, setTab] = React.useState('search');\n    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 20 } },\n      h('div', { style: { border: '1px solid var(--border-soft)', borderRadius: 'var(--radius-card)', overflow: 'hidden' } },\n        h(TopNav, { current: 'week', onScout: () => {}, onMenu: () => {}, logoSrc: 'assets/logo-pin.png', style: { position: 'static' } })),\n      h('div', { style: { width: 390, maxWidth: '100%', border: '1px solid var(--border-soft)', borderRadius: 'var(--radius-card)', overflow: 'hidden', position: 'relative', height: 140, background: 'var(--bg-main)' } },\n        h('div', { style: { padding: 12, font: 'var(--text-meta)', color: 'var(--text-secondary)' } }, 'Mobile viewport (390px)'),\n        h(BottomNav, { current: tab, onNav: setTab, badge: { saved: 3 }, style: { position: 'absolute' } })));\n  }\n  mount('demo-nav', h(NavDemo));\n\n  mount('demo-map', h('div', { style: { display: 'flex', gap: 20, alignItems: 'flex-start', flexWrap: 'wrap' } },\n    h('div', { style: { display: 'flex', gap: 'var(--space-4)', alignItems: 'center', background: 'var(--bg-sunken)', borderRadius: 'var(--radius-card)', padding: 'var(--space-5)' } },\n      h(MapPin, { label: 'Standard' }),\n      h(MapPin, { type: 'free', label: 'Free' }),\n      h(MapPin, { type: 'saved', label: 'Saved' }),\n      h(MapPin, { type: 'approximate', label: 'Approximate' }),\n      h(MapPin, { label: 'Selected', selected: true }),\n      h(MapPin, { type: 'cluster', count: 12 })),\n    h(MapPreviewCard, {\n      title: 'Kids Robotics Workshop', provider: 'Brooklyn Robot Foundry', ages: '6–10',\n      price: '$45', schedule: 'Sat 10am', lastChecked: '2 July 2026', sourceLabel: 'provider website',\n      onViewDetails: () => {}, onClose: () => {},\n    })));\n}).catch((e) => {\n  document.querySelectorAll('[id^=\"demo-\"]').forEach((el) => {\n    el.innerHTML = '<span style=\"font:13px monospace;color:var(--error)\">Demo failed to load: ' + (e && e.message) + '<\u002Fspan>';\n  });\n});\n<\u002Fscript>\n\n<script>\n/* Mark the active section in the contents nav (nav rule: active state is visible).\n   Reduced-motion safe: no animation, just an aria-current flag the CSS styles. */\n(function () {\n  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));\n  var byId = {};\n  links.forEach(function (a) { byId[a.getAttribute('href').slice(1)] = a; });\n  var sections = links.map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); }).filter(Boolean);\n  function setActive(id) {\n    links.forEach(function (a) {\n      a.setAttribute('aria-current', a.getAttribute('href') === '#' + id ? 'true' : 'false');\n    });\n  }\n  if ('IntersectionObserver' in window) {\n    var visible = new Set();\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (en) {\n        if (en.isIntersecting) visible.add(en.target.id); else visible.delete(en.target.id);\n      });\n      /* topmost visible section wins */\n      for (var i = 0; i < sections.length; i++) {\n        if (visible.has(sections[i].id)) { setActive(sections[i].id); break; }\n      }\n    }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });\n    sections.forEach(function (s) { io.observe(s); });\n  }\n})();\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
